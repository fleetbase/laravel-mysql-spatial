name: PHP CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, 'release/v*', 'dev-v*' ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0-oracle
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: spatial_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, gd, zip, pdo_mysql, sockets, intl, bcmath, gmp 
        coverage: xdebug

    - name: Update and Install additional packages
      run: |
        sudo apt-get update
        sudo apt-get install -y libzip-dev libgd-dev libfreetype6-dev libjpeg-dev libpng-dev imagemagick libmagickwand-dev libmemcached-dev libgeos-dev libgmp-dev default-mysql-client libicu-dev

    - name: Validate composer.json
      run: composer validate --no-check-lock

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-interaction

    - name: Run Lint
      run: composer test:lint

    - name: Run unit and integration tests against MySQL
      run: vendor/bin/phpunit -c phpunit.xml.dist --no-coverage
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: spatial_test
        DB_USERNAME: root
        DB_PASSWORD: ""
